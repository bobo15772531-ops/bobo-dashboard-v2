<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>보보 판매 Dashboard V2</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family:
        "Noto Sans KR",
        Arial,
        sans-serif;
      background: #f4f7fb;
      color: #1f2937;
    }

    header {
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      padding: 24px 32px;
    }

    header h1 {
      font-size: 26px;
      margin-bottom: 6px;
    }

    header p {
      color: #6b7280;
      font-size: 14px;
    }

    main {
      max-width: 1400px;
      margin: 0 auto;
      padding: 28px;
    }

    .status-box {
      background: #ffffff;
      border-radius: 14px;
      padding: 16px 20px;
      margin-bottom: 20px;
      box-shadow:
        0 4px 16px rgba(0, 0, 0, 0.05);
    }

    .status-box.loading {
      color: #1d4ed8;
    }

    .status-box.success {
      color: #15803d;
    }

    .status-box.error {
      color: #b91c1c;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns:
        repeat(4, minmax(180px, 1fr));
      gap: 18px;
      margin-bottom: 22px;
    }

    .kpi-card {
      background: #ffffff;
      padding: 22px;
      border-radius: 16px;
      box-shadow:
        0 4px 18px rgba(0, 0, 0, 0.05);
    }

    .kpi-title {
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .kpi-value {
      font-size: 28px;
      font-weight: 800;
    }

    .chart-grid {
      display: grid;
      grid-template-columns:
        minmax(0, 1.6fr)
        minmax(320px, 1fr);
      gap: 18px;
      margin-bottom: 22px;
    }

    .panel {
      background: #ffffff;
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 22px;
      box-shadow:
        0 4px 18px rgba(0, 0, 0, 0.05);
    }

    .chart-grid .panel {
      margin-bottom: 0;
    }

    .panel h2 {
      font-size: 18px;
      margin-bottom: 16px;
    }

    .chart-box {
      position: relative;
      height: 360px;
    }

    .preview-table {
      width: 100%;
      border-collapse: collapse;
    }

    .preview-table th,
    .preview-table td {
      border-bottom: 1px solid #e5e7eb;
      padding: 10px 12px;
      text-align: left;
      font-size: 13px;
    }

    .preview-table th {
      background: #f8fafc;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #9ca3af;
      font-size: 13px;
    }

    @media (max-width: 1000px) {
      .chart-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 900px) {
      .kpi-grid {
        grid-template-columns:
          repeat(2, 1fr);
      }
    }

    @media (max-width: 560px) {
      main {
        padding: 16px;
      }

      header {
        padding: 20px;
      }

      .kpi-grid {
        grid-template-columns: 1fr;
      }

      .chart-box {
        height: 300px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>📊 보보 판매 Dashboard V2</h1>
    <p>Google Sheets DashboardData 기반</p>
  </header>

  <main>

    <section
      id="statusBox"
      class="status-box loading"
    >
      데이터를 불러오는 중입니다.
    </section>

    <section class="kpi-grid">

      <article class="kpi-card">
        <div class="kpi-title">총매출</div>
        <div
          id="totalSales"
          class="kpi-value"
        >
          0원
        </div>
      </article>

      <article class="kpi-card">
        <div class="kpi-title">총주문수</div>
        <div
          id="totalOrders"
          class="kpi-value"
        >
          0건
        </div>
      </article>

      <article class="kpi-card">
        <div class="kpi-title">판매수량</div>
        <div
          id="totalQuantity"
          class="kpi-value"
        >
          0개
        </div>
      </article>

      <article class="kpi-card">
        <div class="kpi-title">평균객단가</div>
        <div
          id="averageOrderValue"
          class="kpi-value"
        >
          0원
        </div>
      </article>

    </section>

    <section class="chart-grid">

      <article class="panel">
        <h2>월별 매출</h2>

        <div class="chart-box">
          <canvas id="monthlySalesChart"></canvas>
        </div>
      </article>

      <article class="panel">
        <h2>카테고리별 매출</h2>

        <div class="chart-box">
          <canvas id="categorySalesChart"></canvas>
        </div>
      </article>

    </section>

    <section class="panel">
      <h2>데이터 미리보기</h2>

      <div style="overflow-x:auto;">
        <table class="preview-table">
          <thead>
            <tr>
              <th>주문일자</th>
              <th>마켓</th>
              <th>카테고리</th>
              <th>모델</th>
              <th>수량</th>
              <th>정산가</th>
            </tr>
          </thead>

          <tbody id="previewBody">
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <footer>
    보보 판매 Dashboard V2
  </footer>

  <script src="config.js"></script>
  <script src="sheet.js"></script>
  <script src="charts.js"></script>

  <script>
    function parseNumber(value) {
      const text = String(value || "")
        .replace(/"/g, "")
        .replace(/,/g, "")
        .replace(/원/g, "")
        .trim();

      const number = Number(text);

      return Number.isFinite(number)
        ? number
        : 0;
    }

    function formatNumber(value) {
      return new Intl.NumberFormat(
        "ko-KR"
      ).format(value);
    }

    function cleanCell(value) {
      return String(value || "")
        .replace(/^"|"$/g, "")
        .trim();
    }

    function updateDashboard(rows) {
      if (!rows || rows.length < 2) {
        throw new Error(
          "불러온 데이터가 없습니다."
        );
      }

      const headers = rows[0].map(
        cleanCell
      );

      const dateIndex =
        headers.indexOf("주문일자");

      const marketIndex =
        headers.indexOf("마켓");

      const categoryIndex =
        headers.indexOf("카테고리");

      const modelIndex =
        headers.indexOf("모델");

      const quantityIndex =
        headers.indexOf("수량");

      const settlementIndex =
        headers.indexOf("정산가");

      if (
        quantityIndex === -1 ||
        settlementIndex === -1
      ) {
        throw new Error(
          "수량 또는 정산가 열을 찾지 못했습니다."
        );
      }

      const dataRows = rows
        .slice(1)
        .filter(row =>
          row.some(cell =>
            cleanCell(cell) !== ""
          )
        );

      let totalSales = 0;
      let totalQuantity = 0;

      dataRows.forEach(row => {
        totalQuantity +=
          parseNumber(
            row[quantityIndex]
          );

        totalSales +=
          parseNumber(
            row[settlementIndex]
          );
      });

      const totalOrders =
        dataRows.length;

      const averageOrderValue =
        totalOrders > 0
          ? Math.round(
              totalSales /
              totalOrders
            )
          : 0;

      document
        .getElementById("totalSales")
        .textContent =
        formatNumber(totalSales) +
        "원";

      document
        .getElementById("totalOrders")
        .textContent =
        formatNumber(totalOrders) +
        "건";

      document
        .getElementById("totalQuantity")
        .textContent =
        formatNumber(totalQuantity) +
        "개";

      document
        .getElementById(
          "averageOrderValue"
        )
        .textContent =
        formatNumber(
          averageOrderValue
        ) + "원";

      renderDashboardCharts(rows);

      const previewBody =
        document.getElementById(
          "previewBody"
        );

      previewBody.innerHTML = "";

      dataRows
        .slice(0, 20)
        .forEach(row => {
          const tr =
            document.createElement("tr");

          const cells = [
            row[dateIndex],
            row[marketIndex],
            row[categoryIndex],
            row[modelIndex],
            row[quantityIndex],
            row[settlementIndex]
          ];

          cells.forEach(
            (cell, index) => {
              const td =
                document.createElement(
                  "td"
                );

              if (
                index === 4 ||
                index === 5
              ) {
                td.textContent =
                  formatNumber(
                    parseNumber(cell)
                  );
              } else {
                td.textContent =
                  cleanCell(cell);
              }

              tr.appendChild(td);
            }
          );

          previewBody.appendChild(tr);
        });

      const statusBox =
        document.getElementById(
          "statusBox"
        );

      statusBox.className =
        "status-box success";

      statusBox.textContent =
        "데이터 연결 완료 · " +
        formatNumber(totalOrders) +
        "건을 불러왔습니다.";
    }

    async function startDashboard() {
      const statusBox =
        document.getElementById(
          "statusBox"
        );

      try {
        const rows =
          await loadSheetData();

        updateDashboard(rows);

      } catch (error) {
        console.error(error);

        statusBox.className =
          "status-box error";

        statusBox.textContent =
          "데이터 연결 실패: " +
          error.message;
      }
    }

    startDashboard();
  </script>

</body>
</html>
