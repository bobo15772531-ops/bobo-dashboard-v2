<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>보보 판매 Dashboard V2</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family:
        "Pretendard",
        "Noto Sans KR",
        Arial,
        sans-serif;

      background: #f4f7fb;
      color: #1f2937;
    }

    header {
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      padding: 24px 32px;
    }

    header h1 {
      font-size: 26px;
      margin-bottom: 6px;
    }

    header p {
      color: #6b7280;
      font-size: 14px;
    }

    main {
      max-width: 1400px;
      margin: 0 auto;
      padding: 28px;
    }

    .filter-section {
      display: grid;
      grid-template-columns:
        repeat(4, minmax(160px, 1fr));
      gap: 14px;

      background: #ffffff;
      padding: 20px;
      border-radius: 16px;
      margin-bottom: 22px;
      box-shadow:
        0 4px 18px rgba(0, 0, 0, 0.05);
    }

    .filter-box label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: 700;
    }

    .filter-box input,
    .filter-box select {
      width: 100%;
      height: 42px;
      padding: 0 12px;

      border: 1px solid #d1d5db;
      border-radius: 9px;
      background: #ffffff;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns:
        repeat(4, minmax(180px, 1fr));
      gap: 18px;
      margin-bottom: 22px;
    }

    .kpi-card {
      background: #ffffff;
      padding: 22px;
      border-radius: 16px;

      box-shadow:
        0 4px 18px rgba(0, 0, 0, 0.05);
    }

    .kpi-title {
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .kpi-value {
      font-size: 28px;
      font-weight: 800;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 18px;
      margin-bottom: 22px;
    }

    .panel {
      background: #ffffff;
      border-radius: 16px;
      padding: 22px;

      box-shadow:
        0 4px 18px rgba(0, 0, 0, 0.05);
    }

    .panel h2 {
      font-size: 18px;
      margin-bottom: 18px;
    }

    .empty-chart {
      height: 280px;
      border: 2px dashed #dbe3ef;
      border-radius: 12px;

      display: flex;
      justify-content: center;
      align-items: center;

      color: #94a3b8;
      background: #f8fafc;
    }

    .wide-panel {
      margin-bottom: 22px;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #9ca3af;
      font-size: 13px;
    }

    @media (max-width: 900px) {
      .filter-section,
      .kpi-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .dashboard-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 560px) {
      header {
        padding: 20px;
      }

      main {
        padding: 16px;
      }

      .filter-section,
      .kpi-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>📊 보보 판매 Dashboard V2</h1>
    <p>Raw_통합 기반 판매실적 분석 대시보드</p>
  </header>

  <main>

    <section class="filter-section">

      <div class="filter-box">
        <label for="startDate">시작일</label>
        <input
          type="date"
          id="startDate"
        >
      </div>

      <div class="filter-box">
        <label for="endDate">종료일</label>
        <input
          type="date"
          id="endDate"
        >
      </div>

      <div class="filter-box">
        <label for="marketFilter">마켓</label>
        <select id="marketFilter">
          <option value="">전체 마켓</option>
        </select>
      </div>

      <div class="filter-box">
        <label for="categoryFilter">카테고리</label>
        <select id="categoryFilter">
          <option value="">전체 카테고리</option>
        </select>
      </div>

    </section>

    <section class="kpi-grid">

      <article class="kpi-card">
        <div class="kpi-title">총매출</div>
        <div class="kpi-value">0원</div>
      </article>

      <article class="kpi-card">
        <div class="kpi-title">주문수</div>
        <div class="kpi-value">0건</div>
      </article>

      <article class="kpi-card">
        <div class="kpi-title">판매수량</div>
        <div class="kpi-value">0개</div>
      </article>

      <article class="kpi-card">
        <div class="kpi-title">평균객단가</div>
        <div class="kpi-value">0원</div>
      </article>

    </section>

    <section class="dashboard-grid">

      <article class="panel">
        <h2>일별 매출 추이</h2>
        <div class="empty-chart">
          Google Sheet 연결 후 차트가 표시됩니다.
        </div>
      </article>

      <article class="panel">
        <h2>카테고리별 매출</h2>
        <div class="empty-chart">
          카테고리 차트 영역
        </div>
      </article>

    </section>

    <section class="dashboard-grid">

      <article class="panel">
        <h2>마켓별 매출</h2>
        <div class="empty-chart">
          마켓별 차트 영역
        </div>
      </article>

      <article class="panel">
        <h2>주문 진행 현황</h2>
        <div class="empty-chart">
          발주 · 재진행 · 물류 · 택배
        </div>
      </article>

    </section>

    <section class="panel wide-panel">
      <h2>TOP 20 모델</h2>
      <div class="empty-chart">
        모델별 판매 순위가 표시될 영역입니다.
      </div>
    </section>

    <section class="panel wide-panel">
      <h2>중복 주문 관리</h2>
      <div class="empty-chart">
        Raw_통합의 중복 주문이 표시될 영역입니다.
      </div>
    </section>

  </main>

  <footer>
    보보 판매 Dashboard V2
  </footer>

</body>
</html>
