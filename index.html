<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>보보 판매 Dashboard V2</title>

  <!-- 차트 라이브러리 -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family:
        "Noto Sans KR",
        Arial,
        sans-serif;

      background: #f4f7fb;
      color: #1f2937;
    }

    header {
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      padding: 24px 32px;
    }

    .header-inner {
      max-width: 1400px;
      margin: 0 auto;

      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    header h1 {
      font-size: 26px;
      margin-bottom: 6px;
    }

    header p {
      color: #6b7280;
      font-size: 14px;
    }

    .header-badge {
      padding: 8px 13px;
      border-radius: 999px;
      background: #eff6ff;
      color: #1d4ed8;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    main {
      max-width: 1400px;
      margin: 0 auto;
      padding: 28px;
    }

    .status-box {
      background: #ffffff;
      border-radius: 14px;
      padding: 16px 20px;
      margin-bottom: 20px;

      box-shadow:
        0 4px 16px rgba(0, 0, 0, 0.05);
    }

    .status-box.loading {
      color: #1d4ed8;
    }

    .status-box.success {
      color: #15803d;
    }

    .status-box.error {
      color: #b91c1c;
    }

    .filter-panel {
      background: #ffffff;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 22px;

      box-shadow:
        0 4px 18px rgba(0, 0, 0, 0.05);
    }

    .filter-panel h2 {
      font-size: 18px;
      margin-bottom: 16px;
    }

    .filter-grid {
      display: grid;

      grid-template-columns:
        repeat(5, minmax(150px, 1fr))
        auto;

      gap: 14px;
      align-items: end;
    }

    .filter-item label {
      display: block;
      margin-bottom: 7px;

      color: #4b5563;
      font-size: 13px;
      font-weight: 700;
    }

    .filter-item input,
    .filter-item select {
      width: 100%;
      height: 42px;

      border: 1px solid #d1d5db;
      border-radius: 9px;

      padding: 0 12px;
      background: #ffffff;
      color: #1f2937;
    }

    .filter-item input:focus,
    .filter-item select:focus {
      outline: none;
      border-color: #2563eb;

      box-shadow:
        0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .reset-button {
      height: 42px;
      border: none;
      border-radius: 9px;

      padding: 0 20px;

      background: #1f2937;
      color: #ffffff;

      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .reset-button:hover {
      background: #111827;
    }

    .kpi-grid {
      display: grid;

      grid-template-columns:
        repeat(4, minmax(180px, 1fr));

      gap: 18px;
      margin-bottom: 22px;
    }

    .kpi-card {
      background: #ffffff;
      padding: 22px;
      border-radius: 16px;

      box-shadow:
        0 4px 18px rgba(0, 0, 0, 0.05);
    }

    .kpi-title {
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .kpi-value {
      font-size: 28px;
      font-weight: 800;
      word-break: keep-all;
    }

    .chart-grid {
      display: grid;

      grid-template-columns:
        minmax(0, 1.6fr)
        minmax(320px, 1fr);

      gap: 18px;
      margin-bottom: 22px;
    }

    .panel {
      background: #ffffff;
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 22px;

      box-shadow:
        0 4px 18px rgba(0, 0, 0, 0.05);
    }

    .chart-grid .panel {
      margin-bottom: 0;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 16px;
    }

    .panel h2 {
      font-size: 18px;
    }

    .panel-note {
      color: #9ca3af;
      font-size: 12px;
    }

    .chart-box {
      position: relative;
      height: 360px;
    }

    .table-scroll {
      overflow-x: auto;
    }

    .preview-table {
      width: 100%;
      border-collapse: collapse;
      white-space: nowrap;
    }

    .preview-table th,
    .preview-table td {
      border-bottom: 1px solid #e5e7eb;
      padding: 11px 12px;
      text-align: left;
      font-size: 13px;
    }

    .preview-table th {
      background: #f8fafc;
      color: #374151;
      position: sticky;
      top: 0;
    }

    .preview-table tbody tr:hover {
      background: #f8fafc;
    }

    .preview-table th:nth-child(5),
    .preview-table th:nth-child(6),
    .preview-table td:nth-child(5),
    .preview-table td:nth-child(6) {
      text-align: right;
    }

    footer {
      text-align: center;
      padding: 25px;

      color: #9ca3af;
      font-size: 13px;
    }

    @media (max-width: 1200px) {
      .filter-grid {
        grid-template-columns:
          repeat(3, 1fr);
      }

      .reset-button {
        width: 100%;
      }
    }

    @media (max-width: 1000px) {
      .chart-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 900px) {
      .kpi-grid {
        grid-template-columns:
          repeat(2, 1fr);
      }

      .header-inner {
        align-items: flex-start;
        flex-direction: column;
      }
    }

    @media (max-width: 700px) {
      .filter-grid {
        grid-template-columns:
          repeat(2, 1fr);
      }
    }

    @media (max-width: 560px) {
      main {
        padding: 16px;
      }

      header {
        padding: 20px;
      }

      .filter-grid,
      .kpi-grid {
        grid-template-columns: 1fr;
      }

      .chart-box {
        height: 300px;
      }

      .kpi-value {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="header-inner">

      <div>
        <h1>📊 보보 판매 Dashboard V2</h1>
        <p>Google Sheets DashboardData 기반 판매 분석</p>
      </div>

      <div class="header-badge">
        자동 데이터 연동
      </div>

    </div>
  </header>

  <main>

    <!-- 데이터 연결 상태 -->
    <section
      id="statusBox"
      class="status-box loading"
    >
      데이터를 불러오는 중입니다.
    </section>

    <!-- 필터 -->
    <section class="filter-panel">

      <h2>판매 데이터 필터</h2>

      <div class="filter-grid">

        <div class="filter-item">
          <label for="startDate">
            시작일
          </label>

          <input
            type="date"
            id="startDate"
          >
        </div>

        <div class="filter-item">
          <label for="endDate">
            종료일
          </label>

          <input
            type="date"
            id="endDate"
          >
        </div>

        <div class="filter-item">
          <label for="marketFilter">
            마켓
          </label>

          <select id="marketFilter">
            <option value="">
              전체 마켓
            </option>
          </select>
        </div>

        <div class="filter-item">
          <label for="categoryFilter">
            카테고리
          </label>

          <select id="categoryFilter">
            <option value="">
              전체 카테고리
            </option>
          </select>
        </div>

        <div class="filter-item">
          <label for="modelSearch">
            모델 검색
          </label>

          <input
            type="text"
            id="modelSearch"
            placeholder="예: AW06, KQ85"
            autocomplete="off"
          >
        </div>

        <button
          type="button"
          id="resetFilters"
          class="reset-button"
        >
          필터 초기화
        </button>

      </div>
    </section>

    <!-- KPI -->
    <section class="kpi-grid">

      <article class="kpi-card">
        <div class="kpi-title">
          총매출
        </div>

        <div
          id="totalSales"
          class="kpi-value"
        >
          0원
        </div>
      </article>

      <article class="kpi-card">
        <div class="kpi-title">
          총주문수
        </div>

        <div
          id="totalOrders"
          class="kpi-value"
        >
          0건
        </div>
      </article>

      <article class="kpi-card">
        <div class="kpi-title">
          판매수량
        </div>

        <div
          id="totalQuantity"
          class="kpi-value"
        >
          0개
        </div>
      </article>

      <article class="kpi-card">
        <div class="kpi-title">
          평균객단가
        </div>

        <div
          id="averageOrderValue"
          class="kpi-value"
        >
          0원
        </div>
      </article>

    </section>

    <!-- 차트 -->
    <section class="chart-grid">

      <article class="panel">

        <div class="panel-header">
          <h2>월별 매출</h2>

          <span class="panel-note">
            정산가 기준
          </span>
        </div>

        <div class="chart-box">
          <canvas id="monthlySalesChart"></canvas>
        </div>

      </article>

      <article class="panel">

        <div class="panel-header">
          <h2>카테고리별 매출</h2>

          <span class="panel-note">
            선택 조건 자동 반영
          </span>
        </div>

        <div class="chart-box">
          <canvas id="categorySalesChart"></canvas>
        </div>

      </article>

    </section>

    <!-- 데이터 미리보기 -->
    <section class="panel">

      <div class="panel-header">
        <h2>데이터 미리보기</h2>

        <span class="panel-note">
          현재 조건 상위 20건
        </span>
      </div>

      <div class="table-scroll">

        <table class="preview-table">

          <thead>
            <tr>
              <th>주문일자</th>
              <th>마켓</th>
              <th>카테고리</th>
              <th>모델</th>
              <th>수량</th>
              <th>정산가</th>
            </tr>
          </thead>

          <tbody id="previewBody">
          </tbody>

        </table>

      </div>
    </section>

  </main>

  <footer>
    보보 판매 Dashboard V2
  </footer>

  <!-- 설정 -->
  <script src="config.js"></script>

  <!-- Google Apps Script 데이터 연결 -->
  <script src="sheet.js"></script>

  <!-- 차트 기능 -->
  <script src="charts.js"></script>

  <!-- 필터 및 KPI 기능 -->
  <script src="app.js"></script>

  <script>
    startDashboard();
  </script>

</body>
</html>
